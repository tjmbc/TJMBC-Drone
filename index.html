<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대전MBC 비행승인/항공촬영 허가구역</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#18212B; --muted:#5E6B78; --line:#DCE2E8;
  --chart:#A3196F;
  --both:#1D8A4C;   /* 비행승인 + 항공촬영 모두 */
  --flight:#2A68B0; /* 비행승인만 */
  --shoot:#D4A300;  /* 항공촬영만 */
  --wait:#8C959E;   /* 승인 대기 */
  --out:#C2352B;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F151B; --panel:#172029; --ink:#E7ECF1; --muted:#97A4B1; --line:#2A3540;
    --chart:#E05AAE; --both:#3CC07A; --flight:#5B9BE6; --shoot:#F2C94C; --wait:#8A949E; --out:#F0665B;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.item:focus-visible,summary:focus-visible{outline:2px solid var(--chart);outline-offset:2px}

.app{display:grid;grid-template-columns:380px 1fr;height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.mapwrap{position:relative;min-height:0}
#map{height:100%;width:100%;background:var(--bg)}

header{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-0.02em;line-height:1.35;word-break:keep-all}
h1 span{color:var(--chart)}
.source{font-size:13px;color:var(--muted);margin-top:4px}
.source b{font-weight:600;color:var(--ink)}
.toolbar{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 10px;font-weight:600;font-size:14px}
.btn.primary{background:var(--chart);border-color:var(--chart);color:#fff}

.fix{margin:14px 20px 0;border-radius:10px;padding:14px 16px;border:1px solid var(--line);display:none}
.fix.show{display:block}
.fix .verdict{font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.2}
.fix .detail{font-size:14px;margin-top:4px}
.fix .acc{font-size:12px;color:var(--muted);margin-top:6px}
.fix.in{border-color:var(--both);background:color-mix(in srgb,var(--both) 12%,transparent)}
.fix.in .verdict{color:var(--both)}
.fix.edge{border-color:var(--shoot);background:color-mix(in srgb,var(--shoot) 16%,transparent)}
.fix.edge .verdict{color:color-mix(in srgb,var(--shoot) 70%,var(--ink))}
.fix.out{border-color:var(--out);background:color-mix(in srgb,var(--out) 12%,transparent)}
.fix.out .verdict{color:var(--out)}
.fix.info .verdict{font-size:16px}

.list{overflow:auto;flex:1;padding:6px 12px 16px}
.item{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.item:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.bar{border-radius:2px;background:var(--c)}
.item.upcoming .bar{background:repeating-linear-gradient(var(--c) 0 6px,transparent 6px 10px)}
.item.expired{opacity:.55}
.row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:600}
.tag{font-size:12px;font-weight:600;color:var(--c);white-space:nowrap}
.meta{font-size:13px;color:var(--muted)}
.empty{padding:24px 12px;color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--muted);padding:10px 20px 14px;border-top:1px solid var(--line)}

/* 오른쪽 위 범례 */
.legend{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;
  font-family:var(--font);font-size:13px;line-height:1.4;max-width:250px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.legend summary{padding:9px 12px;font-weight:700;cursor:pointer;list-style:none}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:"▾";float:right;margin-left:10px;color:var(--muted)}
.legend[open] summary::after{content:"▴"}
.legend .body{padding:0 12px 12px}
.legend h4{margin:10px 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.lg{display:flex;align-items:center;gap:8px;margin:5px 0}
.sw{width:16px;height:16px;border-radius:50%;flex:none;border:2.5px solid var(--c);background:color-mix(in srgb,var(--c) 25%,transparent)}
.sw.ring{background:transparent;border-style:dashed}
.legend label{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer}
.legend input{accent-color:var(--chart);margin:0}
.ax{width:14px;height:10px;border-radius:2px;flex:none;background:var(--a);opacity:.75}
.legend .hint{font-size:12px;color:var(--muted);margin-top:6px}
.legend .disabled{opacity:.45;pointer-events:none}

/* 팝업 */
.leaflet-popup-content{font-family:var(--font);font-size:14px;line-height:1.5;margin:12px 14px;min-width:240px;color:#18212B}
.pp h3{margin:0;font-size:17px}
.pp .sum{font-size:13px;font-weight:600;margin-top:2px}
.pp .sec{margin-top:10px;padding-top:8px;border-top:1px solid #DCE2E8}
.pp .sec h4{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px;font-size:14px}
.pp .badge{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;color:#fff}
.pp dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.pp dt{color:#5E6B78;white-space:nowrap}
.pp dd{margin:0}
.pp a{color:#A3196F;font-weight:600}
.pp .common{font-size:13px;color:#5E6B78;margin-top:4px}
.me{width:16px;height:16px;border-radius:50%;background:#2A68B0;border:3px solid #fff;box-shadow:0 0 0 2px #2A68B0}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:55vh 1fr}
  .side{order:2;border-right:0;border-top:1px solid var(--line)}
  .mapwrap{order:1}
  header{padding:12px 16px 10px}
  .fix{margin:12px 16px 0}
  .legend{max-width:210px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- 파싱 ---------- */
function parseCoord(v){
  if(v==null) return NaN;
  const s=String(v).trim();
  if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const m=s.match(/(\d+(?:\.\d+)?)[^\d]+(\d+(?:\.\d+)?)?[^\d]*(\d+(?:\.\d+)?)?/);
  if(!m) return NaN;
  let val=(+m[1])+(+(m[2]||0))/60+(+(m[3]||0))/3600;
  if(/[SW]/i.test(s)) val=-val;
  return val;
}
// "36.3765, 127.3873" 또는 "36°18′18″N 127°25′16″E" 를 [위도, 경도]로
function parseLatLng(v){
  const s=String(v||"").trim(); if(!s) return null;
  const n=(s.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  let lat,lng;
  if(n.length===2){[lat,lng]=n;}
  else if(n.length===4){lat=n[0]+n[1]/60;lng=n[2]+n[3]/60;}
  else if(n.length===6){lat=n[0]+n[1]/60+n[2]/3600;lng=n[3]+n[4]/60+n[5]/3600;}
  else return null;
  if(lat>90&&lng<=90) [lat,lng]=[lng,lat];   // 경도를 먼저 적은 경우
  return [lat,lng];
}
function parseRadius(v){
  const s=String(v||"").trim().toLowerCase();
  const n=parseFloat(s.replace(/[^\d.]/g,""));
  if(isNaN(n)) return NaN;
  if(s.includes("nm")||s.includes("해리")) return n*1852;
  if(s.includes("km")) return n*1000;
  return n;
}
function parseDate(v){
  const s=String(v||"").trim();
  const m=s.match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/)||s.match(/^(\d{4})(\d{2})(\d{2})$/);
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}
// 상태 문자열 → ok / na(불필요) / pending / rejected / none
function statusOf(v){
  const s=String(v||"").replace(/\s/g,"");
  if(!s) return "none";
  if(/반려|취소|불허/.test(s)) return "rejected";
  if(/불필요|해당없음|면제/.test(s)) return "na";
  if(/신청|대기|검토|접수|처리중|보완/.test(s)) return "pending";
  if(/승인|허가|완료/.test(s)) return "ok";
  return "pending";
}
const STATUS_TXT={ok:"승인",na:"불필요",pending:"대기중",rejected:"반려",none:"미입력"};
const fmtDate=d=>d?`${d.getMonth()+1}/${d.getDate()}`:"?";
const fmtDist=m=>m>=1000?`${(m/1000).toFixed(1)}km`:`${Math.round(m)}m`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function classify(r){
  const f=statusOf(r.비행_상태), s=statusOf(r.촬영_상태);
  const fOK=f==="ok"||f==="na", sOK=s==="ok"||s==="na";
  let kind="wait";
  if(fOK&&sOK&&(f==="ok"||s==="ok")) kind="both";
  else if(f==="ok") kind="flight";
  else if(s==="ok") kind="shoot";
  // 유효 기간: 승인된 신청들의 기간이 겹치는 구간
  const fr=[parseDate(r.비행_시작일),parseDate(r.비행_종료일)], sr=[parseDate(r.촬영_시작일),parseDate(r.촬영_종료일)];
  let ranges=[];
  if(kind==="both"){if(f==="ok")ranges.push(fr);if(s==="ok")ranges.push(sr);}
  else if(kind==="flight") ranges=[fr];
  else if(kind==="shoot") ranges=[sr];
  else ranges=[fr,sr];
  const starts=ranges.map(x=>x[0]).filter(Boolean), ends=ranges.map(x=>x[1]).filter(Boolean);
  let start,end;
  if(kind==="wait"){start=starts.length?new Date(Math.min(...starts)):null;end=ends.length?new Date(Math.max(...ends)):null;}
  else{start=starts.length?new Date(Math.max(...starts)):null;end=ends.length?new Date(Math.min(...ends)):null;}
  const t=new Date();t.setHours(0,0,0,0);
  let date="active";
  if(end&&end<t) date="expired"; else if(start&&start>t) date="upcoming";
  return {kind,date,start,end,f,s};
}

/* ---------- 지도 ---------- */
const map=L.map("map").setView(CONFIG.CENTER,CONFIG.ZOOM);
const VK=CONFIG.VWORLD_KEY;
const vw=(layer,ext)=>L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VK}/${layer}/{z}/{y}/{x}.${ext}`,{maxZoom:19,minZoom:6,attribution:"배경지도: 국토교통부 브이월드"});
const BASES=VK?{normal:vw("Base","png"),sat:L.layerGroup([vw("Satellite","jpeg"),vw("Hybrid","png")])}
  :{normal:L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"})};
let curBase=BASES.normal.addTo(map);
function setBase(k){if(!BASES[k]||BASES[k]===curBase)return;map.removeLayer(curBase);curBase=BASES[k].addTo(map);curBase.bringToBack&&curBase.bringToBack();}
map.createPane("airspace");map.getPane("airspace").style.zIndex=350;
const zoneLayer=L.layerGroup().addTo(map);
let zones=[], me=null, meAcc=null, lastPos=null, watchId=null, firstFit=true;

const airLayers={};
const hasKey=!!CONFIG.VWORLD_KEY;
if(hasKey){
  AIRSPACE.forEach(a=>{
    airLayers[a.id]=L.tileLayer.wms("https://api.vworld.kr/req/wms",{
      layers:a.id,styles:a.id,format:"image/png",transparent:true,version:"1.3.0",
      key:CONFIG.VWORLD_KEY,domain:CONFIG.VWORLD_DOMAIN||location.origin,
      opacity:0.55,pane:"airspace",attribution:"공역: 국토교통부 브이월드"
    });
    if(a.on) airLayers[a.id].addTo(map);
  });
}

/* 오른쪽 위 범례 */
const Legend=L.Control.extend({options:{position:"topright"},onAdd(){
  const d=L.DomUtil.create("details","legend");
  if(window.innerWidth>820) d.open=true;
  d.innerHTML=`<summary>범례</summary><div class="body">
    <h4>허가구역</h4>
    ${KORDER.map(k=>`<div class="lg"><span class="sw" style="--c:var(${KINDS[k].css})"></span>${KINDS[k].label}</div>`).join("")}
    <div class="lg"><span class="sw ring" style="--c:var(--muted)"></span>테두리만 = 기간 시작 전</div>
    <label><input type="checkbox" id="expChk">만료된 구역도 보기</label>
    ${VK?`<h4>배경지도</h4>
    <label><input type="radio" name="base" value="normal" checked>일반지도</label>
    <label><input type="radio" name="base" value="sat">위성지도</label>`:""}
    <h4>공역 (브이월드)</h4>
    <div class="${hasKey?"":"disabled"}">
      ${AIRSPACE.map(a=>`<label><input type="checkbox" data-air="${a.id}" ${hasKey&&a.on?"checked":""}><span class="ax" style="--a:${a.color}"></span>${a.name}</label>`).join("")}
    </div>
    ${hasKey?`<div class="hint">공역 색은 브이월드 기본 스타일로 표시됩니다.</div>`:`<div class="hint">브이월드 인증키를 넣으면 표시됩니다.</div>`}
  </div>`;
  L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);
  d.querySelector("#expChk").onchange=e=>{showExpired=e.target.checked;render();};
  d.querySelectorAll('input[name="base"]').forEach(r=>r.onchange=()=>setBase(r.value));
  d.querySelectorAll("[data-air]").forEach(c=>c.onchange=()=>{
    const l=airLayers[c.dataset.air]; if(!l) return; c.checked?l.addTo(map):map.removeLayer(l);
  });
  return d;
}});
map.addControl(new Legend());

/* ---------- 팝업 ---------- */
function rows(pairs){return pairs.filter(p=>p[1]).map(p=>`<dt>${p[0]}</dt><dd>${p[1]}</dd>`).join("");}
function badge(st){
  const c={ok:cssVar("--both"),na:"#5E6B78",pending:"#8C959E",rejected:"#C2352B",none:"#B0B8C0"}[st];
  return `<span class="badge" style="background:${c}">${STATUS_TXT[st]}</span>`;
}
function link(url,txt){return url?`<a href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>`:"";}
function ymd(v){const d=parseDate(v);return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`:esc(v||"?");}
function period(a,b){return a||b?`${ymd(a)} ~ ${ymd(b)}`:"";}
function popupHtml(z){
  const r=z.row, k=KINDS[z.c.kind];
  const flight=z.c.f==="na"?`<div class="sec"><h4>비행승인 ${badge("na")}</h4></div>`:
   `<div class="sec"><h4>비행승인 ${badge(z.c.f)}</h4><dl>${rows([
     ["신청번호",esc(r.비행_신청번호)],["기간",period(r.비행_시작일,r.비행_종료일)],     ["반경",fmtDist(z.r)],["최대고도",r.비행_고도m?esc(r.비행_고도m)+"m":""],["비행장치",esc(r.비행장치)],
     ["목적",esc(r.비행_목적)],["조건",esc(r.비행_조건)]
   ])}</dl></div>`;
  const shoot=z.c.s==="na"?`<div class="sec"><h4>항공촬영 ${badge("na")}</h4></div>`:
   `<div class="sec"><h4>항공촬영 ${badge(z.c.s)}</h4><dl>${rows([
     ["신청번호",esc(r.촬영_신청번호)],["기간",period(r.촬영_시작일,r.촬영_종료일)],["목표물",esc(r.촬영_목표물)],
     ["촬영고도",r.촬영_고도m?esc(r.촬영_고도m)+"m":""],["촬영장비",esc(r.촬영_장비)],["목적",esc(r.촬영_목적)],
     ["보안검토",esc(r.촬영_보안검토)],["조건",esc(r.촬영_조건)],["허가서",link(r.촬영_허가서,"열기")]
   ])}</dl></div>`;
  return `<div class="pp"><h3>${esc(r.장소명||"이름 없음")}</h3>
    <div class="sum" style="color:${cssVar(k.css)}">${k.short}, ${DLABEL[z.c.date]}</div>
    <div class="common">반경 ${fmtDist(z.r)}${r.조종자?`, 조종자 ${esc(r.조종자)}`:""}</div>
    ${flight}${shoot}</div>`;
}

/* ---------- 그리기 ---------- */
function build(data){
  zones=[];
  data.forEach(row=>{
    const ll=parseLatLng(row.좌표)||[parseCoord(row.위도),parseCoord(row.경도)];
    const lat=ll[0], lng=ll[1], r=parseRadius(row.반경m);
    if(isNaN(lat)||isNaN(lng)||isNaN(r)) return;
    const c=classify(row);
    const z={row,c,lat,lng,r};
    const col=cssVar(KINDS[c.kind].css);
    const style={active:{weight:3,fillOpacity:0.2,dashArray:null,opacity:1},
                 upcoming:{weight:2.5,fillOpacity:0,dashArray:"10 6",opacity:1},
                 expired:{weight:1.5,fillOpacity:0.04,dashArray:"2 6",opacity:0.5}}[c.date];
    z.circle=L.circle([lat,lng],{radius:r,color:col,fillColor:col,...style}).bindPopup(()=>popupHtml(z),{maxWidth:320});
    zones.push(z);
  });
  render();
}
function render(){
  zoneLayer.clearLayers();
  const vis=zones.filter(z=>showExpired||z.c.date!=="expired");
  vis.forEach(z=>z.circle.addTo(zoneLayer));
  if(firstFit&&vis.length){map.fitBounds(L.featureGroup(vis.map(z=>z.circle)).getBounds().pad(0.15));firstFit=false;}
  const dOrder={active:0,upcoming:1,expired:2};
  const sorted=[...vis].sort((a,b)=>dOrder[a.c.date]-dOrder[b.c.date]||KORDER.indexOf(a.c.kind)-KORDER.indexOf(b.c.kind)||((a.c.start||0)-(b.c.start||0)));
  const list=document.getElementById("list");
  list.innerHTML=sorted.length?sorted.map(z=>{
    const alt=[z.row.비행_고도m,z.row.촬영_고도m].map(Number).filter(n=>!isNaN(n)&&n>0);
    return `<div class="item ${z.c.date}" tabindex="0" data-i="${zones.indexOf(z)}" style="--c:var(${KINDS[z.c.kind].css})">
      <div class="bar"></div><div>
        <div class="row1"><span class="name">${esc(z.row.장소명||"이름 없음")}</span><span class="tag">${KINDS[z.c.kind].short}</span></div>
        <div class="meta">${DLABEL[z.c.date]}, ${fmtDate(z.c.start)}~${fmtDate(z.c.end)}, 반경 ${fmtDist(z.r)}${alt.length?`, 고도 ${Math.min(...alt)}m`:""}</div>
      </div></div>`;}).join(""):`<div class="empty">표시할 허가구역이 없습니다. 시트에 행을 추가하거나 범례에서 ‘만료된 구역도 보기’를 켜 보세요.</div>`;
  list.querySelectorAll(".item").forEach(el=>{
    const go=()=>{const z=zones[+el.dataset.i];map.fitBounds(z.circle.getBounds().pad(0.2));z.circle.openPopup();
      if(window.innerWidth<=820) document.getElementById("map").scrollIntoView({behavior:"smooth"});};
    el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter")go();};
  });
  if(lastPos) judge(lastPos);
}

/* ---------- 불러오기 ---------- */
const setSource=t=>document.getElementById("source").innerHTML=t;
const now=()=>{const d=new Date();return `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;};
function load(){
  if(!CONFIG.SHEET_CSV_URL){build(SAMPLE.map(r=>({...r})));setSource(`<b>샘플 데이터</b>로 보는 중, ${now()} 기준`);return;}
  setSource("시트에서 불러오는 중…");
  const base=CONFIG.SHEET_CSV_URL;
  const tries=[base+(base.includes("?")?"&":"?")+"t="+Date.now(), base];
  (async()=>{
    let lastErr="";
    for(const url of tries){
      try{
        const res=await fetch(url,{cache:"no-store",redirect:"follow"});
        if(!res.ok) throw new Error("HTTP "+res.status);
        const text=await res.text();
        if(/^\s*<(!doctype|html)/i.test(text)) throw new Error("CSV가 아닌 웹페이지가 돌아옴");
        const out=Papa.parse(text,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
        build(out.data);
        setSource(`<b>구글 시트</b> 연동, ${now()} 갱신 (${zones.length}건)`);
        return;
      }catch(e){lastErr=e.message||String(e);}
    }
    const local=location.protocol==="file:";
    setSource(`시트를 불러오지 못했습니다 (${esc(lastErr)}).`+
      (local?" 파일을 크롬으로 열었는지 확인하세요. 사파리는 내 컴퓨터 파일에서 외부 데이터를 막습니다.":" ‘웹에 게시’가 CSV로 되어 있는지 확인하세요."));
  })();
}

/* ---------- 내 위치 판정 ---------- */
function showFix(cls,v,d,a){
  const f=document.getElementById("fix");f.className="fix show "+cls;
  document.getElementById("verdict").textContent=v;
  document.getElementById("detail").textContent=d||"";
  document.getElementById("acc").textContent=a||"";
}
function judge(pos){
  const here=L.latLng(pos.lat,pos.lng);
  const act=zones.filter(z=>z.c.date==="active"&&z.c.kind!=="wait").map(z=>({z,margin:z.r-here.distanceTo([z.lat,z.lng])}));
  const acc=`GPS 오차 약 ±${Math.round(pos.acc)}m, ${now()} 측정`;
  const inside=act.filter(a=>a.margin>=0);
  const best=k=>inside.filter(a=>a.z.c.kind===k).sort((a,b)=>b.margin-a.margin)[0];
  const g=best("both");
  if(g){
    const tight=g.margin<Math.max(CONFIG.EDGE_WARN_M,pos.acc);
    showFix(tight?"edge":"in",tight?"허가구역 경계 근처":"비행·촬영 허가구역 안",`${g.z.row.장소명}, 경계까지 ${fmtDist(g.margin)}`,acc);return;
  }
  const f=best("flight"), s=best("shoot");
  if(f){showFix("edge","비행승인만 있는 구역","항공촬영 허가가 아직 없습니다. 촬영은 하지 마세요.",acc);return;}
  if(s){showFix("edge","항공촬영 허가만 있는 구역","비행승인이 아직 없습니다. 비행 전 확인하세요.",acc);return;}
  if(!act.length){showFix("info","오늘 유효한 허가구역이 없습니다","대기중이거나 기간 전인 구역은 아직 비행할 수 없습니다.",acc);return;}
  const n=act.sort((a,b)=>b.margin-a.margin)[0];
  showFix("out","허가구역 밖",`가장 가까운 ${n.z.row.장소명}까지 ${fmtDist(-n.margin)}`,acc);
}
document.getElementById("locBtn").onclick=()=>{
  if(!("geolocation" in navigator)){showFix("info","이 기기에서는 위치를 확인할 수 없습니다");return;}
  if(location.protocol!=="https:"&&!["localhost","127.0.0.1"].includes(location.hostname))
    showFix("info","위치 확인은 https 주소에서만 됩니다","파일을 https 주소에 올린 뒤 휴대폰으로 열어 주세요.");
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  let centered=false;
  watchId=navigator.geolocation.watchPosition(p=>{
    lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    const ll=[lastPos.lat,lastPos.lng];
    if(!me){me=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16]})}).addTo(map);
      meAcc=L.circle(ll,{radius:lastPos.acc,color:"#2A68B0",weight:1,fillOpacity:0.08,interactive:false}).addTo(map);}
    else{me.setLatLng(ll);meAcc.setLatLng(ll).setRadius(lastPos.acc);}
    if(!centered){map.setView(ll,15);centered=true;}
    judge(lastPos);
  },err=>showFix("info","위치를 가져오지 못했습니다",err.code===1?"브라우저 설정에서 위치 권한을 허용해 주세요.":"잠시 후 다시 시도해 주세요."),
  {enableHighAccuracy:true,maximumAge:5000,timeout:15000});
};
document.getElementById("refreshBtn").onclick=load;
load();
if(CONFIG.SHEET_CSV_URL&&CONFIG.AUTO_REFRESH_MIN>0) setInterval(load,CONFIG.AUTO_REFRESH_MIN*60000);
</script>
